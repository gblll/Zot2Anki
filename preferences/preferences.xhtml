<linkset>
  <html:link rel="localization" href="zot2anki.ftl"/>
</linkset>

<vbox id="zot2anki-preferences-pane">
  <groupbox aria-labelledby="zot2anki-preferences-heading">
    <label>
      <html:h2 id="zot2anki-preferences-heading" data-l10n-id="zot2anki-preferences-heading"/>
    </label>

    <html:div class="zot2anki-preference-row">
      <html:label for="zot2anki-filter-color" data-l10n-id="zot2anki-preferences-color-label"/>
      <html:input
        id="zot2anki-filter-color"
        type="color"
        preference="extensions.zotero2anki.filterColor"/>
    </html:div>
    <description data-l10n-id="zot2anki-preferences-color-description"/>

    <separator class="thin"/>

    <html:label for="zot2anki-tag-keyword" data-l10n-id="zot2anki-preferences-keyword-label"/>
    <html:input
      id="zot2anki-tag-keyword"
      type="text"
      preference="extensions.zotero2anki.tagKeyword"/>
    <description data-l10n-id="zot2anki-preferences-keyword-description"/>
  </groupbox>
</vbox>
